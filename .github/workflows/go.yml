name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Verify dependencies
      run: make tidy && git diff --exit-code

    - name: Format Check
      run: make fmt && git diff --exit-code

    - name: Vet
      run: make vet

    - name: Build
      run: make build

    - name: Test
      run: make test

    - name: Test with Race
      run: make test-race
